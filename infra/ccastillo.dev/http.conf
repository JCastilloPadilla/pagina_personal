<VirtualHost *:80>
    ServerName ccastillo.dev
    ServerAlias www.ccastillo.dev
    DocumentRoot /var/www/ccastillo.dev/public_html
    ServerSignature Off

    Include /etc/apache2/ccastillo.dev-security.conf
    ErrorLog ${APACHE_LOG_DIR}/ccastillo.dev_error.log
    CustomLog ${APACHE_LOG_DIR}/ccastillo.dev_access.log combined

    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
    RewriteRule ^ https://ccastillo.dev%{REQUEST_URI} [R=301,L,NE]
</VirtualHost>
