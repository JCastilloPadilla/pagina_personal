<Directory /var/www/ccastillo.dev/public_html>
    Options -Indexes -Includes -ExecCGI -FollowSymLinks
    AllowOverride None
    Require all granted
    DirectoryIndex index.html

    <FilesMatch "(?i)(^\.|~$|\.(env|ini|log|sql|bak|old|orig|swp|pem|key|php[0-9]?|phtml|phar)$)">
        Require all denied
    </FilesMatch>
</Directory>

# Keep ACME validation reachable, but do not expose other hidden paths.
RedirectMatch 404 "(?i)/\.(?!well-known(?:/|$))"
